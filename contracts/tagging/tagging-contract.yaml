unresolved_governance:
  enforceable: false
  policy_input: false
  items:
    - id: registry-status-semantics
      question: Which registry statuses represent approved deployable values?
      v2_treatment: Preserve status metadata without enforcing it.
    - id: platform-capability-mapping
      question: Which governed platform value applies to an Azure Resource Group and Storage Account foundation?
      v2_treatment: Do not equate capability with platform and do not invent a value.
    - id: cost-center-pattern
      question: What exact pattern implements the documented cost-center value model?
      v2_treatment: Enforce registry membership only; no regex is defined.
    - id: azure-effective-tagging-mechanism
      question: Which future provisioning or policy mechanism guarantees effective tags on both resource types?
      v2_treatment: State resource applicability without claiming Azure-native inheritance.
