schema_version: "1.0"
contract_version: "0.1.0"
kind: tagging-contract

metadata:
  name: friday-vertical-slice
  status: poc
  sources:
    - references/Clayco_Tagging_Framework 5.docx
    - references/Clayco_Tag_Library 7.xlsx
    - references/Clayco_Tagging_Worksheet 6.xlsx

scope:
  capability:
    id: azure-application-foundation
    version: v0
    governed_tag: false
  target:
    provider: azure
    subscription: existing
  resources:
    - type: Microsoft.Resources/resourceGroups
      effective_tags_required: true
    - type: Microsoft.Storage/storageAccounts
      effective_tags_required: true
  azure_native_tag_inheritance_assumed: false

consumer_fields:
  service:
    required: true
    type: string
    governed_tag_key: service
  team:
    required: true
    type: string
    governed_tag_key: team
  environment:
    required: true
    type: string
    governed_tag_key: env
  cost_center:
    required: true
    type: string
    governed_tag_key: cost-center

platform_fields:
  provider:
    source: platform-derived
    governed_tag_key: provider
    value: azure
  location:
    source: platform-configured
    governed_tag_key: location
    default: centralus
    default_scope: friday-poc
    governance_policy: false
  platform:
    source: platform-derived
    governed_tag_key: platform
    value: null
    resolution: unresolved-governance-mapping
    enforceable_in_v2: false

governance_validation:
  formatting:
    keys_and_values:
      lowercase_required: true
      permitted_separator: hyphen
      prohibited:
        - spaces
        - underscores
        - camel-case
        - pascal-case
  applicability:
    effective_tags:
      - service
      - team
      - env
      - cost-center
      - provider
      - location
    resource_types:
      - Microsoft.Resources/resourceGroups
      - Microsoft.Storage/storageAccounts
  enforceable_rules:
    - id: required-effective-tags
      assertion: required
      tag_keys:
        - service
        - team
        - env
        - cost-center
        - provider
        - location
    - id: registered-service
      assertion: registry-membership
      tag_key: service
      registry: service
    - id: registered-team
      assertion: registry-membership
      tag_key: team
      registry: team
    - id: allowed-environment
      assertion: registry-membership
      tag_key: env
      registry: env
    - id: registered-cost-center
      assertion: registry-membership
      tag_key: cost-center
      registry: cost-center
    - id: azure-provider
      assertion: equals
      tag_key: provider
      value: azure
    - id: azure-location
      assertion: registry-membership
      tag_key: location
      registry: azure-location
  deferred_source_requirements:
    - tag_key: platform
      source_requirement: required-on-all-in-scope-resources
      enforceable_in_v2: false
      reason: no-registered-value-describes-resource-group-plus-storage-capability
  registry_status_policy:
    preserve_metadata: true
    enforce_status: false
    reason: source-status-semantics-are-not-defined-consistently
  conditional_rules: []

registries:
  service:
    value_model: curated-free-form
    values:
      - value: headshot-api
        source_status: demo
        status_interpretation: poc-source-metadata-only
  team:
